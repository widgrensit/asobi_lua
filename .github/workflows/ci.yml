name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: Taure/erlang-ci/.github/workflows/ci.yml@v2.1.4
    permissions:
      contents: write
      pull-requests: write
    with:
      version-file: '.tool-versions'
      # version-file drives analysis jobs; the eunit/ct matrix needs otp-matrix
      # (else it falls back to the otp-version default of 28). And meck is a
      # test-only dep absent from rebar.lock, so a stale OTP-28-era meck is
      # restored from cache and fails on OTP 29 - drop it so it re-resolves.
      otp-matrix: '["29.0.2"]'
      pre-test-command: 'rm -rf _build/test/lib/meck'
      enable-ct: true
      # asobi_lua_storage_SUITE talks to a real Postgres - the mocked
      # game.storage.* coverage is what let asobi#296 through.
      extra-services-compose: 'docker-compose.yml'
      enable-audit: true
      enable-dependency-submission: true
      enable-summary: true
    secrets: inherit

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
