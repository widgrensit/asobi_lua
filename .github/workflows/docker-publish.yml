name: Docker publish

# Staleness gate (widgrensit/asobi_lua#103): the locked `asobi` ref in
# rebar.lock can lag an already-fixed-upstream asobi release for up to a
# week, because bump-asobi-pin only runs on a schedule. This workflow fails
# loudly if the locked ref is behind the latest asobi release rather than
# silently publishing a stale image.
#
# Deliberately fail-open on GitHub API/infrastructure hiccups (rate limit,
# transient 5xx, timeout, no release yet, malformed response) and fail-closed
# only on a definite "ahead"/"diverged" comparison - a stale pin should block
# a publish, a flaky API call should not.
#
# Follow-up out of scope for this repo: #103 also proposes a
# repository_dispatch from asobi's own release workflow to trigger
# bump-asobi-pin.yml immediately on every asobi release (the fastest fix).
# That requires adding a dispatch step to widgrensit/asobi's CI, which is a
# change to a different repo - tracked as widgrensit/asobi#276.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Fail if the locked asobi pin is behind the latest asobi release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          # Fail-open on infrastructure hiccups (rate limit, transient 5xx, no
          # release yet, malformed response), fail-closed only on a definite
          # "ahead"/"diverged" answer from the compare API. A GitHub API
          # blip must never block every publish.
          soft_fail() {
            echo "::warning::asobi staleness check skipped - $1"
            exit 0
          }

          locked_ref=$(grep -A2 '<<"asobi">>' rebar.lock | grep -oE '[0-9a-f]{40}' | head -1)
          if [ -z "$locked_ref" ]; then
            soft_fail "could not extract the locked asobi ref from rebar.lock"
          fi

          latest_tag=$(gh api repos/widgrensit/asobi/releases/latest --jq '.tag_name' 2>/dev/null)
          if [ -z "$latest_tag" ]; then
            soft_fail "could not fetch the latest widgrensit/asobi release (no release yet, or API error)"
          fi

          latest_sha=$(gh api "repos/widgrensit/asobi/commits/${latest_tag}" --jq '.sha' 2>/dev/null)
          if [ -z "$latest_sha" ]; then
            soft_fail "could not resolve commit sha for asobi release ${latest_tag}"
          fi

          echo "locked asobi ref:     $locked_ref"
          echo "latest asobi release: $latest_tag ($latest_sha)"

          if [ "$locked_ref" = "$latest_sha" ]; then
            echo "asobi pin matches the latest release; not stale."
            exit 0
          fi

          status=$(gh api "repos/widgrensit/asobi/compare/${locked_ref}...${latest_sha}" --jq '.status' 2>/dev/null)
          case "$status" in
            behind)
              echo "locked ref already contains commits not yet in a tagged release; not stale."
              ;;
            ahead|diverged)
              echo "::error::asobi pin is stale - rebar.lock pins ${locked_ref}, but the latest asobi release ${latest_tag} (${latest_sha}) is '${status}' relative to it. Run the bump-asobi-pin workflow (or 'rebar3 upgrade asobi'), merge the pin bump, and re-run this publish."
              exit 1
              ;;
            *)
              soft_fail "unexpected or empty git compare status '${status}' between ${locked_ref} and ${latest_sha} (likely a transient API error)"
              ;;
          esac

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
